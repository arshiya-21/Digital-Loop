<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 84" width="64" height="84"><g class="eq" data-state="run"><style>
.eq{--c-run:var(--sm-run,#2fa84f);--c-stop:var(--sm-stop,#9aa3a9);--c-fault:var(--sm-fault,#e5484d);--c-closed:var(--sm-closed,#c9302c);--c-travel:var(--sm-travel,#e8b21c);--c-manual:var(--sm-manual,#e08a2c);--st:var(--c-stop);--level:.6;--angle:40deg}
.eq[data-state="run"],.eq[data-state="open"]{--st:var(--c-run)}
.eq[data-state="stop"]{--st:var(--c-stop)}
.eq[data-state="closed"]{--st:var(--c-closed)}
.eq[data-state="travel"]{--st:var(--c-travel)}
.eq[data-state="manual"]{--st:var(--c-manual)}
.eq[data-state="fault"]{--st:var(--c-fault)}
.eq .st{fill:var(--st);transition:fill .3s}
.eq .st-s{stroke:var(--st);transition:stroke .3s}
.eq[data-state="fault"] .st,.eq[data-state="fault"] .st-s{animation:sm-blink 1s steps(2,jump-none) infinite}
.eq .spin{transform-box:fill-box;transform-origin:center}
.eq[data-state="run"] .spin{animation:sm-spin 2.4s linear infinite}
.eq .lvl{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--level))}
.eq .needle{transform-box:view-box;transform-origin:var(--nx,50px) var(--ny,50px);transform:rotate(var(--angle))}
.eq[data-state="run"] .flow{animation:sm-flow 1.2s linear infinite}
@keyframes sm-blink{50%{opacity:.25}}@keyframes sm-spin{to{transform:rotate(360deg)}}@keyframes sm-flow{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){.eq *{animation:none!important}}
</style><defs>
<linearGradient id="smpressure-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d9dc"/><stop offset=".45" stop-color="#9aa2a8"/><stop offset="1" stop-color="#5d666c"/></linearGradient>
<linearGradient id="smpressure-steelh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d666c"/><stop offset=".35" stop-color="#cfd5d8"/><stop offset=".6" stop-color="#a3abb0"/><stop offset="1" stop-color="#565f65"/></linearGradient>
<linearGradient id="smpressure-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b545a"/><stop offset="1" stop-color="#262c30"/></linearGradient>
<radialGradient id="smpressure-glass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs><rect x="28" y="62" width="8" height="16" fill="url(#smpressure-dark)"/><rect x="22" y="76" width="20" height="6" rx="1" fill="url(#smpressure-dark)" stroke="#1f262b"/><circle cx="32" cy="32" r="29" fill="url(#smpressure-steel)" stroke="#1f262b" stroke-width="1.6"/><circle cx="32" cy="32" r="23" fill="#f6f7f8" stroke="#5d666c"/><path d="M32 12V16" stroke="#5d666c" stroke-width="1.6" transform="rotate(-120 32 32)"/><path d="M32 12V16" stroke="#5d666c" stroke-width="1.6" transform="rotate(-80 32 32)"/><path d="M32 12V16" stroke="#5d666c" stroke-width="1.6" transform="rotate(-40 32 32)"/><path d="M32 12V16" stroke="#5d666c" stroke-width="1.6" transform="rotate(0 32 32)"/><path d="M32 12V16" stroke="#5d666c" stroke-width="1.6" transform="rotate(40 32 32)"/><path d="M32 12V16" stroke="#5d666c" stroke-width="1.6" transform="rotate(80 32 32)"/><path d="M32 12V16" stroke="#5d666c" stroke-width="1.6" transform="rotate(120 32 32)"/><path class="st-s" d="M14 44A20 20 0 0 1 12 34" fill="none" stroke-width="4"/><g class="needle" style="--nx:32px;--ny:32px"><path d="M32 32L32 13" stroke="#c9302c" stroke-width="2.4" stroke-linecap="round"/></g><circle cx="32" cy="32" r="3" fill="#1f262b"/></g></svg>
