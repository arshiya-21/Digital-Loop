</defs>
<style>
.mpm-gateway-art{--cycle:2s;--flow-cycle:1s}
.mpm-gateway-art .spin{transform-box:fill-box;transform-origin:center;animation:mpm-gateway-spin var(--cycle) linear infinite}
.mpm-gateway-art .lift{animation:mpm-gateway-lift var(--cycle) linear infinite}
.mpm-gateway-art .lower{animation:mpm-gateway-lower var(--cycle) linear infinite}
.mpm-gateway-art .index-forward{animation:mpm-gateway-index var(--cycle) linear infinite}
.mpm-gateway-art .index-back{animation:mpm-gateway-index var(--cycle) linear infinite reverse}
.mpm-gateway-art .vibrate{animation:mpm-gateway-shake .16s linear infinite}
.mpm-gateway-art .reciprocate{animation:mpm-gateway-press calc(var(--cycle)*2) ease-in-out infinite}
.mpm-gateway-art .belt{animation:mpm-gateway-belt var(--flow-cycle) linear infinite}
.mpm-gateway-art .travel{animation:mpm-gateway-travel var(--cycle) linear infinite}
.mpm-gateway-art .flow{animation:mpm-gateway-flow var(--flow-cycle) linear infinite}
.mpm-gateway-art .auger{animation:mpm-gateway-auger var(--cycle) linear infinite}
.mpm-gateway-art .heat{animation:mpm-gateway-heat .7s ease-in-out infinite alternate}
.mpm-gateway-art .lift,.mpm-gateway-art .lower,.mpm-gateway-art .index-forward,.mpm-gateway-art .index-back,.mpm-gateway-art .spin,.mpm-gateway-art .vibrate,.mpm-gateway-art .reciprocate,.mpm-gateway-art .belt,.mpm-gateway-art .travel,.mpm-gateway-art .flow,.mpm-gateway-art .auger,.mpm-gateway-art .heat{animation-play-state:paused}
body.simulating .mpm-gateway-art .lift,body.simulating .mpm-gateway-art .lower,body.simulating .mpm-gateway-art .index-forward,body.simulating .mpm-gateway-art .index-back,body.simulating .mpm-gateway-art .spin,body.simulating .mpm-gateway-art .vibrate,body.simulating .mpm-gateway-art .reciprocate,body.simulating .mpm-gateway-art .belt,body.simulating .mpm-gateway-art .travel,body.simulating .mpm-gateway-art .flow,body.simulating .mpm-gateway-art .auger,body.simulating .mpm-gateway-art .heat{animation-play-state:running}
body.simulating .mpm-gateway-art .status-light{fill:#34d399}
.never-matches{fill:#f15b50}
.never-matches{fill:#f4b74c}
.mpm-gateway-art .ports{display:none}
.never-matches{display:inline}
@keyframes mpm-gateway-lift{to{transform:translateY(-48px)}}
@keyframes mpm-gateway-lower{to{transform:translateY(48px)}}
@keyframes mpm-gateway-index{to{transform:translateX(83px)}}
@keyframes mpm-gateway-spin{to{transform:rotate(360deg)}}
@keyframes mpm-gateway-shake{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes mpm-gateway-press{0%,20%,100%{transform:translateY(0)}45%,65%{transform:translateY(28px)}}
@keyframes mpm-gateway-belt{to{stroke-dashoffset:-28}}
@keyframes mpm-gateway-travel{to{transform:translateX(112px)}}
@keyframes mpm-gateway-flow{to{stroke-dashoffset:-24}}
@keyframes mpm-gateway-auger{to{transform:translateX(30px)}}
@keyframes mpm-gateway-heat{to{opacity:.45}}
@media(prefers-reduced-motion:reduce){.mpm-gateway-art *{animation:none!important}}
