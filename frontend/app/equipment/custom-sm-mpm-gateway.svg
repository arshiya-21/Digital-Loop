<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="233.00 125.00 334.00 365.00" width="176" height="193"><g class="mpm-gateway-art"><defs>
<linearGradient id="mpm-gateway-blue" x1="0" y1="0" x2="1" y2=".1"><stop offset="0.0" stop-color="#666c70" /><stop offset="0.16666666666666666" stop-color="#8d9397" /><stop offset="0.3333333333333333" stop-color="#a1a5a9" /><stop offset="0.5" stop-color="#acb0b3" /><stop offset="0.6666666666666666" stop-color="#a1a6a9" /><stop offset="0.8333333333333334" stop-color="#898f93" /><stop offset="1.0" stop-color="#656a6e" /></linearGradient>
<linearGradient id="mpm-gateway-darkblue" x1="0" y1="0" x2="0" y2="1"><stop offset="0.0" stop-color="#abafb2" /><stop offset="0.5" stop-color="#9ba0a4" /><stop offset="1.0" stop-color="#80878b" /></linearGradient>
<linearGradient id="mpm-gateway-steel"><stop offset="0.0" stop-color="#686e72" /><stop offset="0.25" stop-color="#969b9f" /><stop offset="0.5" stop-color="#afb3b6" /><stop offset="0.75" stop-color="#9a9fa3" /><stop offset="1.0" stop-color="#6b7175" /></linearGradient>
<linearGradient id="mpm-gateway-darksteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0.0" stop-color="#64696d" /><stop offset="0.5" stop-color="#4f5356" /><stop offset="1.0" stop-color="#35383a" /></linearGradient>
<linearGradient id="mpm-gateway-sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c7b69a" /><stop offset="1" stop-color="#887759" /></linearGradient>
<linearGradient id="mpm-gateway-black" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c0d0d" /><stop offset="1" stop-color="#202123" /></linearGradient>
<linearGradient id="mpm-gateway-glass"><stop stop-color="#1a1c1d" /><stop offset=".4" stop-color="#4c5154" /><stop offset="1" stop-color="#202223" /></linearGradient>
