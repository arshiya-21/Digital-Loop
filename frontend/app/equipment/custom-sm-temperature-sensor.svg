<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="270.00 81.00 227.00 546.00" width="119" height="286"><g class="temperature-sensor-art"><defs>
<linearGradient id="temperature-sensor-blue" x1="0" y1="0" x2="1" y2=".1"><stop offset="0.0" stop-color="#666c70" /><stop offset="0.16666666666666666" stop-color="#8d9397" /><stop offset="0.3333333333333333" stop-color="#a1a5a9" /><stop offset="0.5" stop-color="#acb0b3" /><stop offset="0.6666666666666666" stop-color="#a1a6a9" /><stop offset="0.8333333333333334" stop-color="#898f93" /><stop offset="1.0" stop-color="#656a6e" /></linearGradient>
<linearGradient id="temperature-sensor-darkblue" x1="0" y1="0" x2="0" y2="1"><stop offset="0.0" stop-color="#abafb2" /><stop offset="0.5" stop-color="#9ba0a4" /><stop offset="1.0" stop-color="#80878b" /></linearGradient>
<linearGradient id="temperature-sensor-steel"><stop offset="0.0" stop-color="#686e72" /><stop offset="0.25" stop-color="#969b9f" /><stop offset="0.5" stop-color="#afb3b6" /><stop offset="0.75" stop-color="#9a9fa3" /><stop offset="1.0" stop-color="#6b7175" /></linearGradient>
<linearGradient id="temperature-sensor-darksteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0.0" stop-color="#64696d" /><stop offset="0.5" stop-color="#4f5356" /><stop offset="1.0" stop-color="#35383a" /></linearGradient>
<linearGradient id="temperature-sensor-sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c7b69a" /><stop offset="1" stop-color="#887759" /></linearGradient>
<linearGradient id="temperature-sensor-black" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c0d0d" /><stop offset="1" stop-color="#202123" /></linearGradient>
<linearGradient id="temperature-sensor-glass"><stop stop-color="#1a1c1d" /><stop offset=".4" stop-color="#4c5154" /><stop offset="1" stop-color="#202223" /></linearGradient>
<radialGradient id="temperature-sensor-bolt" cx=".3" cy=".2"><stop stop-color="#fff" /><stop offset=".45" stop-color="#9ea3a7" /><stop offset="1" stop-color="#45494b" /></radialGradient>
</defs>
<style>
.temperature-sensor-art{--cycle:2s;--flow-cycle:1s}
.temperature-sensor-art .spin{transform-box:fill-box;transform-origin:center;animation:temperature-sensor-spin var(--cycle) linear infinite}
.temperature-sensor-art .lift{animation:temperature-sensor-lift var(--cycle) linear infinite}
.temperature-sensor-art .lower{animation:temperature-sensor-lower var(--cycle) linear infinite}
.temperature-sensor-art .index-forward{animation:temperature-sensor-index var(--cycle) linear infinite}
.temperature-sensor-art .index-back{animation:temperature-sensor-index var(--cycle) linear infinite reverse}
.temperature-sensor-art .vibrate{animation:temperature-sensor-shake .16s linear infinite}
.temperature-sensor-art .reciprocate{animation:temperature-sensor-press calc(var(--cycle)*2) ease-in-out infinite}
.temperature-sensor-art .belt{animation:temperature-sensor-belt var(--flow-cycle) linear infinite}
.temperature-sensor-art .travel{animation:temperature-sensor-travel var(--cycle) linear infinite}
.temperature-sensor-art .flow{animation:temperature-sensor-flow var(--flow-cycle) linear infinite}
.temperature-sensor-art .auger{animation:temperature-sensor-auger var(--cycle) linear infinite}
.temperature-sensor-art .heat{animation:temperature-sensor-heat .7s ease-in-out infinite alternate}
.temperature-sensor-art .lift,.temperature-sensor-art .lower,.temperature-sensor-art .index-forward,.temperature-sensor-art .index-back,.temperature-sensor-art .spin,.temperature-sensor-art .vibrate,.temperature-sensor-art .reciprocate,.temperature-sensor-art .belt,.temperature-sensor-art .travel,.temperature-sensor-art .flow,.temperature-sensor-art .auger,.temperature-sensor-art .heat{animation-play-state:paused}
body.simulating .temperature-sensor-art .lift,body.simulating .temperature-sensor-art .lower,body.simulating .temperature-sensor-art .index-forward,body.simulating .temperature-sensor-art .index-back,body.simulating .temperature-sensor-art .spin,body.simulating .temperature-sensor-art .vibrate,body.simulating .temperature-sensor-art .reciprocate,body.simulating .temperature-sensor-art .belt,body.simulating .temperature-sensor-art .travel,body.simulating .temperature-sensor-art .flow,body.simulating .temperature-sensor-art .auger,body.simulating .temperature-sensor-art .heat{animation-play-state:running}
body.simulating .temperature-sensor-art .status-light{fill:#34d399}
.never-matches{fill:#f15b50}
.never-matches{fill:#f4b74c}
.temperature-sensor-art .ports{display:none}
.never-matches{display:inline}
@keyframes temperature-sensor-lift{to{transform:translateY(-48px)}}
@keyframes temperature-sensor-lower{to{transform:translateY(48px)}}
@keyframes temperature-sensor-index{to{transform:translateX(83px)}}
@keyframes temperature-sensor-spin{to{transform:rotate(360deg)}}
@keyframes temperature-sensor-shake{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes temperature-sensor-press{0%,20%,100%{transform:translateY(0)}45%,65%{transform:translateY(28px)}}
@keyframes temperature-sensor-belt{to{stroke-dashoffset:-28}}
@keyframes temperature-sensor-travel{to{transform:translateX(112px)}}
@keyframes temperature-sensor-flow{to{stroke-dashoffset:-24}}
@keyframes temperature-sensor-auger{to{transform:translateX(30px)}}
@keyframes temperature-sensor-heat{to{opacity:.45}}
@media(prefers-reduced-motion:reduce){.temperature-sensor-art *{animation:none!important}}
