<svg xmlns="http://www.w3.org/2000/svg" width="450" height="520" viewBox="0 0 450 520" fill="none">
  <title>Sand muller — bright teal green, Digital Loop</title>
  <desc>Editable 2D front-elevation illustration based on the supplied sand muller photograph. Brightened original teal-green finish, cylindrical drum, auxiliary drives, support frame, lower gear drive, yellow safety guard and dark base. Transparent background. Schematic, not a fabrication drawing.</desc>
