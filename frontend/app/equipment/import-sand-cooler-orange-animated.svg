<title>Rotary sand cooler — animated orange Digital Loop symbol</title>
<desc>2D side-elevation illustration based on the supplied rotary cooler. Original orange drum with metallic riding rings and a dark stationary base. Axial rotation is illustrated with travelling shell seams, rotating girth-gear teeth and roller faces. Illustrative motion only, not live machine telemetry or a fabrication drawing. Transparent background.</desc>
