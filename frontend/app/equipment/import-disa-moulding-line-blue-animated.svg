<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="510" viewBox="0 0 1560 510" fill="none">
<title>DISA-reference moulding line — blue front elevation</title>
<desc>Illustrative straight-on full-line elevation based on the supplied perspective photo, not a dimensional reconstruction. Main moulding enclosure at left, raised process station and safety rails at centre, control cabinet and outgoing conveyor at right. Transparent background. Editable grouped vectors. Animated illustrative mould-box flow: 15 boxes, left to right, 20-second circuit. Conveyor extended for visibility. Not live production data.</desc>
