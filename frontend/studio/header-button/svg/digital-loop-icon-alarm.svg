<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Digital Loop"><title>Digital Loop</title><style>
.dl-dash{animation:dl-flow 1.1s linear infinite}
.dl-node{animation:dl-pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dl-halo{animation:dl-halo 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dl-flow{to{stroke-dashoffset:-8.8}}
@keyframes dl-pulse{50%{transform:scale(.82)}}
@keyframes dl-halo{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.dl-dash,.dl-node,.dl-halo{animation:none}.dl-bead{display:none}}
</style><path d="M12 12.5C10.3 9.1 7.8 7.5 5.7 7.5 3.6 7.5 2 9.7 2 12.5s1.6 5 3.7 5c2.1 0 4.6-1.6 6.3-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="dl-dash" d="M12 12.5c1.7-3.4 4.2-5 6.3-5 2.1 0 3.7 2.2 3.7 5s-1.6 5-3.7 5c-2.1 0-4.6-1.6-6.3-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.1 2.3" stroke-dashoffset="1"/><circle class="dl-bead" r="2.1" fill="#e5332a" stroke="#fff" stroke-width="1"><animateMotion dur="3.2s" repeatCount="indefinite" path="M12 12.5C10.3 9.1 7.8 7.5 5.7 7.5 3.6 7.5 2 9.7 2 12.5s1.6 5 3.7 5c2.1 0 4.6-1.6 6.3-5c1.7-3.4 4.2-5 6.3-5 2.1 0 3.7 2.2 3.7 5s-1.6 5-3.7 5c-2.1 0-4.6-1.6-6.3-5"/></circle><circle class="dl-halo" cx="20.6" cy="4.2" r="2.3" fill="#e5332a" opacity=".45"/><circle class="dl-node" cx="20.6" cy="4.2" r="2.3" fill="#e5332a" stroke="#fff" stroke-width="1.3"/></svg>